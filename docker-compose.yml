version: '3.8'
services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      - POSTGRES_USER=default
      - POSTGRES_PASSWORD=default
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - '5432:5432'
  api:
    depends_on:
      - postgres
    build: .
    restart: unless-stopped
    environment:
      - POSTGRES_USER=default
      - POSTGRES_PASSWORD=default
    ports:
      - '8000:8000'
volumes:
  postgres:
