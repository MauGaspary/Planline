version: '3.8'
services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      - POSTGRES_USER=default
      - POSTGRES_PASSWORD=default
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - '5432:5432'
  api:
    container_name: backend
    image: planlineages/backend:latest
    depends_on:
      - postgres
    build: .
    restart: unless-stopped
    environment:
      - POSTGRES_USER=default
      - POSTGRES_PASSWORD=default
      - PORT=8000
      - DATABASE_URL="postgresql://default:default@localhost:5432/backend?schema=public"
    ports:
      - '8000:8000'
volumes:
  postgres:
