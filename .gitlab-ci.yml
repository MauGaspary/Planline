stages:
  - build
  - deploy

services:
  - docker:dind

before_script:
  - docker login -u $DOCKER_USER -p $DOCKER_TOKEN

# ------------- BUILD SCRIPT -------------

build-node:
  image: docker:dind
  tags: 
    - ages-runner
  stage: build
  script:
    - docker build --build-arg VITE_API_KEY=$VITE_API_KEY --build-arg VITE_AUTH_DOMAIN=$VITE_AUTH_DOMAIN --build-arg VITE_PROJECT_ID=$VITE_PROJECT_ID --build-arg VITE_STORAGE_BUCKET=$VITE_STORAGE_BUCKET --build-arg VITE_MESSAGING_SENDER_ID=$VITE_MESSAGING_SENDER_ID --build-arg VITE_APP_ID=$VITE_APP_ID --build-arg VITE_API_URL=$VITE_API_URL --build-arg BACKEND_API_URL=$BACKEND_API_URL --build-arg FIREBASE_API_KEY=$FIREBASE_API_KEY --build-arg FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN --build-arg FIREBASE_DATABASE_URL=$FIREBASE_DATABASE_URL --build-arg FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID --build-arg FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET --build-arg FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID --build-arg FIREBASE_APP_ID=$FIREBASE_APP_ID --build-arg FIREBASE_MEASUREMENT_ID=$FIREBASE_MEASUREMENT_ID -t $DOCKER_USER/web -f Dockerfile .
    - docker push $DOCKER_USER/web
  only:
    - main

# ------------- DEPLOY SCRIPT -------------
deploy-node:
  stage: deploy
  image: docker:dind
  script:
    - docker stop web || true
    - docker rm web || true
    - docker pull $DOCKER_USER/web
    - docker compose up -d
  tags:
    - ages-runner
  when: manual
  only:
    - main
