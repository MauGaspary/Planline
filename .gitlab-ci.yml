stages:
  - build
  - deploy
  - migrate

services:
  - docker:dind

before_script:
  - docker login -u $DOCKER_USER -p $DOCKER_TOKEN

# ------------- BUILD SCRIPT -------------

build-node:
  image: docker:dind
  tags: 
    - ages-runner
  stage: build
  script:
    - docker build -t $DOCKER_USER/backend -f Dockerfile .
    - docker push $DOCKER_USER/backend
#  only:
#    - main

# ------------- DEPLOY SCRIPT -------------
deploy-node:
  stage: deploy
  image: docker:dind
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apk add --update openssh )' 
    - eval $(ssh-agent -s)
#    - echo "$PLANLINE_PEM" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - ssh-keyscan ec2-3-133-108-144.us-east-2.compute.amazonaws.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
#    - docker stop backend || true
#    - docker rm backend || true
  script:
    - sleep 1h
    - ssh -T ec2-user@ec2-3-133-108-144.us-east-2.compute.amazonaws.com
    - docker pull $DOCKER_USER/backend
    - docker compose up -d
  tags:
    - ages-runner
  when: manual
#  only:
#    - main

# ------------- MIGRATE SCRIPT -------------
migrate-prisma:
  stage: migrate
  image: docker:dind
  before_script:
    - ./planline.pem < echo $PLANLINE_PEM
    - chmod 600 planline.pem
    - ssh -i planline.pem ec2-user@ec2-3-133-108-144.us-east-2.compute.amazonaws.com
  script:
    - docker exec backend yarn prisma migrate deploy 
  tags:
    - ages-runner
  when: manual
#  only:
#    - main