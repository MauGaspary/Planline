stages:
  - build
  - deploy

services:
  - docker:dind

before_script:
  - docker login -u $DOCKER_USER -p $DOCKER_TOKEN

# ------------- BUILD SCRIPTS -------------

build-node:
  image: docker:dind
  tags: 
    - ages-runner
  stage: build
  script:
    - docker build -t $DOCKER_USER/backend -f Dockerfile .
    - docker push $DOCKER_USER/backend
#  only:
#    - main

# ------------- DEPLOY SCRIPTS -------------
deploy-node:
  stage: deploy
  image: docker:dind
  before_script:
    - docker stop backend || true
    - docker rm backend || true
  script:
    - docker pull $DOCKER_USER/backend
    - docker compose up -d
  tags:
    - ages-runner
#  only:
#    - main