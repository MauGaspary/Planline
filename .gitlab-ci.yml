stages:
  - build
  - deploy

services:
  - docker:dind

before_script:
  - docker login -u $DOCKER_USER -p $DOCKER_TOKEN

# ------------- BUILD SCRIPT -------------

build-node:
  image: docker:dind
  tags: 
    - ages-runner
  stage: build
  script:
    - docker build -t $DOCKER_USER/web -f Dockerfile .
    - docker push $DOCKER_USER/web
  # only:
  #   - main

# ------------- DEPLOY SCRIPT -------------
deploy-node:
  stage: deploy
  image: docker:dind
  script:
    - docker stop web || true
    - docker rm web || true
    - docker pull $DOCKER_USER/web
    - docker compose up -d
  tags:
    - ages-runner
  when: manual
  # only:
  #   - main
