stages:
  - build
  - deploy
  - migrate

services:
  - docker:dind

before_script:
  - docker login -u $DOCKER_USER -p $DOCKER_TOKEN

# ------------- BUILD SCRIPT -------------

build-node:
  image: docker:dind
  tags: 
    - ages-runner
  stage: build
  script:
    - docker build --build-arg DATABASE_URL="$DATABASE_URL" --build-arg FIREBASE_API_KEY="$FIREBASE_API_KEY" --build-arg FIREBASE_APP_ID="$FIREBASE_APP_ID" --build-arg FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" --build-arg FIREBASE_DATABASE_URL="$FIREBASE_DATABASE_URL" --build-arg FIREBASE_MEASUREMENT_ID="$FIREBASE_MEASUREMENT_ID" --build-arg FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" --build-arg FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" --build-arg FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" --build-arg PLANLINE_PEM="$PLANLINE_PEM" --build-arg PORT="$PORT" --build-arg POSTGRES_PASSWORD="$POSTGRES_PASSWORD" --build-arg POSTGRES_USER="$POSTGRES_USER" -t "$DOCKER_USER/backend" -f Dockerfile .

    - docker push $DOCKER_USER/backend
  #only:
  #  - main

# ------------- DEPLOY SCRIPT -------------
deploy-node:
  stage: deploy
  image: docker:dind
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apk add --update openssh )' 
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - ssh-keyscan ec2-18-191-189-90.us-east-2.compute.amazonaws.com >> ~/.ssh/known_hosts
  script:
    - ssh -T ec2-user@ec2-18-191-189-90.us-east-2.compute.amazonaws.com "docker stop backend || true"
    - ssh -T ec2-user@ec2-18-191-189-90.us-east-2.compute.amazonaws.com "docker rm backend || true"
    - ssh -T ec2-user@ec2-18-191-189-90.us-east-2.compute.amazonaws.com "docker pull $DOCKER_USER/backend"
    - ssh -T ec2-user@ec2-18-191-189-90.us-east-2.compute.amazonaws.com "docker compose up -d"
  tags:
    - ages-runner
  when: manual
  only:
    - main

# ------------- MIGRATE SCRIPT -------------
migrate-prisma:
  stage: migrate
  image: docker:dind
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apk add --update openssh )' 
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - ssh-keyscan ec2-18-191-189-90.us-east-2.compute.amazonaws.com >> ~/.ssh/known_hosts
  script:
    - ssh -T ec2-user@ec2-18-191-189-90.us-east-2.compute.amazonaws.com "docker exec backend yarn prisma migrate deploy"
  tags:
    - ages-runner
  when: manual
  only:
    - main
